<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xiaomi GetApps 包名在线检测</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;margin:0;background:#f5f7fa;color:#222}.wrap{max-width:1200px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px #00000010}h1{margin:0 0 18px;font-size:24px}.bar{display:flex;gap:8px;flex-wrap:wrap}.bar input{flex:1;min-width:300px;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:15px}.bar button{padding:10px 15px;border:0;border-radius:8px;cursor:pointer}.primary{background:#1677ff;color:#fff}.table{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#fafafa}.online{color:#0a9b45;font-weight:bold}.offline{color:#d93025;font-weight:bold}.other{color:#b26a00}.url{max-width:430px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{margin-top:12px;color:#555}.hint{margin-top:12px;color:#777;font-size:13px;line-height:1.6}.small{font-size:12px;color:#888}</style></head><body><div class="wrap"><div class="card"><h1>Xiaomi GetApps 包名在线检测工具</h1><div class="bar"><input id="pkg" value="com.nk5fv.c6np" placeholder="输入 Android 包名，例如 com.nk5fv.c6np"><button class="primary" onclick="run()">开始检测</button><button onclick="copyAll()">复制全部链接</button><button onclick="exportCsv()">导出 CSV</button></div><div class="stats" id="stats">共 60 项：每个语言同时检查完整代码和语言简写</div><div class="table"><table><thead><tr><th>语言</th><th>完整代码</th><th>简写</th><th>状态</th><th>HTTP</th><th>检测链接</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="hint">检测规则：每个语言会分别检测 <b>la=完整代码</b> 和 <b>la=语言简写</b>。浏览器直接打开本地 H5 时可能受到 Xiaomi 网站 CORS 跨域限制；遇到这种情况会显示“浏览器跨域限制”，并不会把它误判为不在线。双击“打开”可直接访问对应链接。</div></div></div><script>
const langs=[['俄语','ru_RU','ru'],['意大利语','it_IT','it'],['波兰语','pl_PL','pl'],['罗马尼亚语','ro_RO','ro'],['土耳其语','tr_TR','tr'],['印地语','hi_IN','hi'],['美式西班牙语','es_US','es'],['葡萄牙语（巴西）','pt_BR','pt'],['泰语','th_TH','th'],['柬埔寨语','km_KH','km'],['法语','fr_FR','fr'],['日语','ja_JP','ja'],['孟加拉语','bn_BD','bn'],['印尼语','id_ID','id'],['捷克语','cs_CZ','cs'],['德语','de_DE','de'],['马来语','ms_MY','ms'],['繁体中文（台湾）','zh_TW','zh'],['繁体中文（香港）','zh_HK','zh'],['西班牙语','es_ES','es'],['菲律宾语','fil_PH','fil'],['越南语','vi_VN','vi'],['缅甸语','my_MM','my'],['英语（英国）','en_GB','en'],['韩语','ko_KR','ko'],['英语（美国）','en_US','en'],['乌克兰语','uk_UA','uk'],['乌尔都语','ur_PK','ur'],['简体中文','zh_CN','zh'],['阿拉伯语','ar_SA','ar']];
let results=[]; const base='https://global.app.mi.com/details?lo=ID&la=';
function url(pkg,la){return base+encodeURIComponent(la)+'&id='+encodeURIComponent(pkg)}
function addRow(i,name,full,short){let tr=document.createElement('tr');tr.id='r'+i;tr.innerHTML=`<td>${name}</td><td>${full}</td><td>${short}</td><td id="s${i}" class="other">检测中</td><td id="h${i}">-</td><td class="url"><a id="u${i}" href="${url(document.getElementById('pkg').value.trim(),full)}" target="_blank">${url(document.getElementById('pkg').value.trim(),full)}</a></td><td><button onclick="window.open(document.getElementById('u${i}').href,'_blank')">打开</button></td>`;document.getElementById('tbody').appendChild(tr)}
function init(){document.getElementById('tbody').innerHTML='';let n=0;for(const x of langs){addRow(n++,x[0],x[1],x[2]);addRow(n++,x[0],x[2],x[2])}}
async function check(i,la){let pkg=document.getElementById('pkg').value.trim();let u=url(pkg,la);try{let c=new AbortController();let t=setTimeout(()=>c.abort(),9000);let r=await fetch(u,{mode:'cors',redirect:'follow',signal:c.signal});clearTimeout(t);let text=await r.text();let low=text.toLowerCase();let bad=['page not found','app not available','application not found','应用不存在'];let offline=r.status===404||bad.some(x=>low.includes(x));return [offline?'不在线':'在线',r.status]}catch(e){return ['浏览器跨域限制','-']}}
async function run(){let pkg=document.getElementById('pkg').value.trim();if(!/^[A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)+$/.test(pkg)){alert('请输入正确的 Android 包名');return}init();results=[];let total=langs.length*2,done=0,online=0,offline=0,other=0;document.getElementById('stats').textContent=`检测中 0/${total}`;for(let i=0;i<langs.length;i++){for(let j=1;j<=2;j++){let la=j===1?langs[i][1]:langs[i][2];let idx=i*2+(j-1);let [s,h]=await check(idx,la);let el=document.getElementById('s'+idx);el.textContent=s;el.className=s==='在线'?'online':s==='不在线'?'offline':'other';document.getElementById('h'+idx).textContent=h;results.push([langs[i][0],j===1?langs[i][1]:langs[i][2],langs[i][2],s,h,url(pkg,la)]);done++;if(s==='在线')online++;else if(s==='不在线')offline++;else other++;document.getElementById('stats').textContent=`检测中 ${done}/${total}　在线 ${online}　不在线 ${offline}　其他 ${other}`}}document.getElementById('stats').textContent=`完成 ${done}/${total}　在线 ${online}　不在线 ${offline}　其他 ${other}`}
function copyAll(){let pkg=document.getElementById('pkg').value.trim();let a=[];for(const x of langs){a.push(url(pkg,x[1]));a.push(url(pkg,x[2]))}navigator.clipboard.writeText(a.join('\n')).then(()=>alert('已复制 60 个检测链接'))}
function exportCsv(){if(!results.length){alert('请先开始检测');return}let rows=[['语言','代码','简写','状态','HTTP','链接'],...results];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='xiaomi_getapps_check.csv';a.click();URL.revokeObjectURL(a.href)}
init();</script></body></html>
